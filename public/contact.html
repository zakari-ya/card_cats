<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Cat Cards</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Cat Cards</h1>
        <nav class="header-nav">
            <a href="index.html" class="nav-link">Home</a>
            <a href="about.html" class="nav-link">About</a>
            <a href="contact.html" class="nav-link active">Contact</a>
        </nav>
        <div class="header-actions">
            <a href="index.html" class="btn-secondary">Back to App</a>
        </div>
    </header>

    <main class="page-content">
        <section class="contact-container">
            <h2>Get in Touch</h2>
            <p>Have a question or want to share a cute cat photo? Send us a message!</p>

            <form class="contact-form">
                <label>Name
                    <input type="text" placeholder="Your Name" required>
                </label>
                <label>Email
                    <input type="email" placeholder="your@email.com" required>
                </label>
                <label>Message
                    <textarea placeholder="Write your message here..." rows="5" required></textarea>
                </label>
                <button type="submit" class="btn-primary">Send Message</button>
            </form>
        </section>
    </main>
</body>

</html>
